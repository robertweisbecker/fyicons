name: Release packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    # Enable only after the first publication and trusted publisher setup.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Dispatch read-only checks for the bot-created version PR.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run version:packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
      - name: Request release PR verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_PR: ${{ steps.version.outputs.pr-number }}
        run: |
          [[ "$VERSION_PR" =~ ^[1-9][0-9]*$ ]]
          pr=$(gh api "repos/$GH_REPO/pulls/$VERSION_PR")
          # Resolve only the PR returned by Changesets, in this repository.
          # Never dispatch the publishing workflow or follow a fork's ref.
          jq -e --arg repo "$GH_REPO" '
            .state == "open" and
            .base.repo.full_name == $repo and .base.ref == "main" and
            .head.repo.full_name == $repo and .head.ref == "changeset-release/main" and
            (.head.sha | test("^[0-9a-f]{40}$")) and
            (.base.sha | test("^[0-9a-f]{40}$"))
          ' <<< "$pr" > /dev/null
          jq '{ref: .head.ref, inputs: {base: .base.sha, expected_head: .head.sha}}' <<< "$pr" |
            gh api --method POST "repos/$GH_REPO/actions/workflows/release-prep.yml/dispatches" --input -

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:icons
      - run: npm run check:registry
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
      - run: git diff --exit-code
      - name: Build release comparison
        run: |
          base=$(git describe --tags --match 'fyicons@*' --abbrev=0 HEAD 2>/dev/null || printf empty)
          npm run diff:icons -- --base "$base" --head HEAD
          cat artifacts/icon-diff/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checks-${{ github.sha }}
          path: |
            artifacts/verification.json
            artifacts/icon-diff/
          if-no-files-found: error
          retention-days: 14
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
