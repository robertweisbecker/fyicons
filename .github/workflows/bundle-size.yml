name: Bundle size

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number to compare
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Use the same measurement tooling for both package revisions, including
      # existing PRs that do not contain this workflow yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Compare fixed base and head packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: node scripts/compare-bundle-size.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size
          path: artifacts/bundle-size/
          retention-days: 14
          if-no-files-found: error
