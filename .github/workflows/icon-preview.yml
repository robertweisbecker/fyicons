name: Icon preview images

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: icon-preview-render-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Render the fixed PR comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$PR_BASE" HEAD)
          npm run diff:icons -- --base "$base" --head HEAD --pr-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-preview
          path: artifacts/icon-diff/pr-preview/
          retention-days: 1
          if-no-files-found: error
